<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2F+9W8BqT0w+6p+uM6s8UqWp6q8q+tq/x+y+6F+P0+v+E+7z+g" crossorigin="anonymous">
    <!-- Custom CSS for Fiverr-like styling -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand text-fiverr-green fw-bold fs-4" href="#">Fiverr</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gigs.html">Gigs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="messages.html">Messages</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="#" class="btn btn-outline-secondary me-2">Sign In</a>
            <a href="#" class="btn btn-fiverr">Join</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 card-fiverr">
                    <h2 class="text-center mb-4 text-fiverr-green fw-bold">Create a New Account</h2>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="isFreelancer">
                            <label class="form-check-label" for="isFreelancer">
                                I am a Freelancer
                            </label>
                        </div>
                        <button type="submit" class="btn btn-fiverr w-100">Register</button>
                    </form>
                    <div id="message" class="text-center mt-3"></div>
                    <div class="text-center mt-3">
                        <a href="/login.html" class="text-decoration-none">Already have an account? Login here.</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted footer-brand">Fiverr Clone</span>
            <p class="mb-0 mt-2">© 2024 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-geWF76RCwLtnZ8qwWow/a7z7K/8W/f/8T9sF2Z5x95R9eN9r6E8E8/b" crossorigin="anonymous"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const isFreelancer = document.getElementById('isFreelancer').checked;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password, isFreelancer })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = 'Registration successful! Redirecting to login...';
                    messageDiv.className = 'text-success mt-3 text-center';
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 2000);
                } else {
                    messageDiv.textContent = data.msg || 'Registration failed. Please try again.';
                    messageDiv.className = 'text-danger mt-3 text-center';
                }
            } catch (error) {
                console.error('Error:', error);
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'text-danger mt-3 text-center';
            }
        });
    </script>
</body>
</html>
