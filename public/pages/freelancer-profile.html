<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Freelancer Profile</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>

<!-- Header -->
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand text-fiverr-green fw-bold fs-4" href="/">Fiverr</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/pages/gigs.html">Gigs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/pages/freelancers.html">Freelancers</a>
        </li>
      </ul>
      <div class="d-flex" id="auth-links">
        <a href="/pages/login.html" class="btn btn-outline-secondary me-2">Sign In</a>
        <a href="/pages/register.html" class="btn btn-fiverr">Join</a>
      </div>
      <div class="d-flex" id="account-links" style="display: none;">
        <ul class="navbar-nav mb-2 mb-lg-0">
            <li class="nav-item">
                <a class="nav-link" href="/pages/messages.html">Messages</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/pages/my-gigs.html">My Gigs</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/pages/create-gig.html">Post a Gig</a>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  Account
                </a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" href="/pages/profile.html">Profile</a></li>
                  <li><hr class="dropdown-divider"></li>
                  <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<div class="container my-5">
    <div class="card card-fiverr">
        <div class="card-body">
            <div id="loading" class="text-center">
                <div class="spinner-border text-fiverr-green" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div id="freelancerProfileContent" style="display: none;">
                <div class="d-flex align-items-center mb-4">
                    <img src="https://placehold.co/100x100/22c55e/ffffff?text=F" class="rounded-circle me-3" alt="Profile Picture">
                    <div>
                        <h1 id="freelancerName" class="card-title fw-bold mb-0"></h1>
                        <p id="freelancerUsername" class="text-muted"></p>
                    </div>
                </div>
                <p id="freelancerBio" class="card-text"></p>
                <div class="mt-4">
                    <h4 class="fw-bold">Contact</h4>
                    <p id="freelancerEmail" class="mb-0"></p>
                </div>
                <hr>
                <div id="freelancerGigsSection">
                    <h4 class="fw-bold">Gigs</h4>
                    <div id="freelancerGigsList" class="row row-cols-1 row-cols-md-2 g-4">
                        <!-- Gigs will be dynamically inserted here -->
                    </div>
                </div>
                
            </div>
            <div id="notFound" class="alert alert-danger d-none">Freelancer not found.</div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="footer mt-auto py-3">
    <div class="container text-center">
        <span class="text-muted footer-brand">Fiverr Clone</span>
        <p class="mb-0 mt-2">© 2024 All Rights Reserved.</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/freelancer-profile.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('token');
        const authLinks = document.getElementById('auth-links');
        const accountLinks = document.getElementById('account-links');
        const logoutBtn = document.getElementById('logoutBtn');

        if (token) {
            authLinks.style.display = 'none';
            accountLinks.style.display = 'flex';
        } else {
            authLinks.style.display = 'flex';
            accountLinks.style.display = 'none';
        }

        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                window.location.href = '/';
            });
        }
    });
</script>

</body>
</html>
