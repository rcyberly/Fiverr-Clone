<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gigs | Dynamic Listings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .link-active {
            font-weight: 600;
            color: #10B981; /* green-500 */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Dynamic Header -->
    <header id="dynamic-header" class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <a href="/" class="text-3xl font-bold text-gray-800">
                        <span class="text-green-500">Fiverr</span><span class="text-gray-800">r</span>
                    </a>
                </div>

                <!-- Main Navigation Links -->
                <nav class="hidden md:flex flex-grow justify-start space-x-8 pl-8">
                    <a href="/gigs.html" class="text-gray-600 hover:text-green-500 transition-colors duration-200">Gigs</a>
                    <a href="/freelancers.html" class="text-gray-600 hover:text-green-500 transition-colors duration-200">Freelancers</a>
                </nav>

                <!-- Auth/User Menu -->
                <div class="flex items-center space-x-4">
                    <a href="/login.html" class="hidden sm:inline-block text-gray-600 font-medium hover:text-green-500 transition-colors duration-200">Sign in</a>
                    <a href="/join.html" class="hidden sm:inline-block bg-green-500 text-white font-medium py-2 px-6 rounded-full hover:bg-green-600 transition-colors duration-200">Join</a>
                    <div class="relative group">
                        <button class="flex items-center space-x-2 text-gray-600 font-medium hover:text-green-500 transition-colors duration-200">
                            <span>Account</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 hidden group-hover:block">
                            <a href="/mygigs.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">My Gigs</a>
                            <a href="/postgig.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Post a Gig</a>
                            <a href="/profile.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="/logout.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-4 sm:p-8">
        <h1 class="text-4xl sm:text-5xl font-bold text-center mb-8 text-gray-800">All Gigs</h1>

        <!-- Search and Filter Section -->
        <div class="bg-white p-6 rounded-3xl shadow-lg mb-8">
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <!-- Search Input -->
                <div class="relative w-full sm:w-2/3">
                    <input type="text" id="search-input" placeholder="Search gigs by title or description..." class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-green-500 transition-all duration-200" />
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </div>
                
                <!-- Filter Checkboxes -->
                <div class="flex-grow flex flex-wrap gap-2 justify-center sm:justify-end">
                    <button class="filter-btn text-sm font-medium py-2 px-4 rounded-full transition-all duration-200 bg-green-500 text-white" data-filter="All">All</button>
                    <button class="filter-btn text-sm font-medium py-2 px-4 rounded-full transition-all duration-200 bg-gray-200 text-gray-600 hover:bg-green-200 hover:text-green-700" data-filter="Web Development">Web Dev</button>
                    <button class="filter-btn text-sm font-medium py-2 px-4 rounded-full transition-all duration-200 bg-gray-200 text-gray-600 hover:bg-green-200 hover:text-green-700" data-filter="Graphic Design">Design</button>
                    <button class="filter-btn text-sm font-medium py-2 px-4 rounded-full transition-all duration-200 bg-gray-200 text-gray-600 hover:bg-green-200 hover:text-green-700" data-filter="Writing & Translation">Writing</button>
                    <button class="filter-btn text-sm font-medium py-2 px-4 rounded-full transition-all duration-200 bg-gray-200 text-gray-600 hover:bg-green-200 hover:text-green-700" data-filter="Video & Animation">Video</button>
                </div>
            </div>
        </div>
        
        <!-- Gigs Grid Container -->
        <div id="gigs-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Gig cards will be dynamically inserted here -->
        </div>

        <!-- No Gigs Found Message -->
        <div id="no-gigs-message" class="hidden text-center text-gray-500 mt-12">
            <p class="text-xl font-medium">No gigs found matching your criteria. Try adjusting your search or filters.</p>
        </div>
    </div>

    <script>
        // Dummy data for gigs
        const gigsData = [
            { id: 1, title: 'Build a modern e-commerce website', category: 'Web Development', author: 'Jane Doe', price: 500, description: 'I will create a responsive and fast e-commerce website using React and Tailwind CSS.' },
            { id: 2, title: 'Professional logo design for your brand', category: 'Graphic Design', author: 'John Smith', price: 150, description: 'I will design a unique and memorable logo that perfectly represents your business.' },
            { id: 3, title: 'Write SEO-optimized blog articles', category: 'Writing & Translation', author: 'Alice Johnson', price: 80, description: 'I will write high-quality, engaging, and SEO-friendly articles for your blog.' },
            { id: 4, title: 'Create a stunning promotional video', category: 'Video & Animation', author: 'Bob Williams', price: 300, description: 'I will produce a professional promotional video with motion graphics and background music.' },
            { id: 5, title: 'Full-stack web application development', category: 'Web Development', author: 'Charlie Brown', price: 800, description: 'From front-end to back-end, I will build a complete web application tailored to your needs.' },
            { id: 6, title: 'Custom vector illustration', category: 'Graphic Design', author: 'Diana Prince', price: 120, description: 'I will create a custom vector illustration for your website, app, or social media.' },
            { id: 7, title: 'Proofreading and editing services', category: 'Writing & Translation', author: 'Bruce Wayne', price: 50, description: 'I will meticulously proofread and edit your text for grammar, spelling, and clarity.' },
            { id: 8, title: '3D animated short film', category: 'Video & Animation', author: 'Clark Kent', price: 1000, description: 'I will create a short 3D animated film based on your story concept.' },
        ];

        // Get DOM elements
        const gigsContainer = document.getElementById('gigs-container');
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const noGigsMessage = document.getElementById('no-gigs-message');

        // Function to render gigs
        function renderGigs(gigs) {
            gigsContainer.innerHTML = '';
            if (gigs.length === 0) {
                noGigsMessage.classList.remove('hidden');
            } else {
                noGigsMessage.classList.add('hidden');
                gigs.forEach(gig => {
                    const gigCard = document.createElement('div');
                    gigCard.className = 'bg-white p-6 rounded-3xl shadow-lg hover:shadow-xl transition-shadow duration-200 cursor-pointer';
                    gigCard.innerHTML = `
                        <span class="inline-block bg-gray-200 text-gray-600 text-xs font-medium px-3 py-1 rounded-full mb-3">${gig.category}</span>
                        <h2 class="text-xl font-semibold text-gray-800 mb-2">${gig.title}</h2>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-3">${gig.description}</p>
                        <div class="flex justify-between items-center text-gray-700 font-medium">
                            <span class="text-sm">by ${gig.author}</span>
                            <span class="text-lg text-green-600 font-bold">$${gig.price}</span>
                        </div>
                    `;
                    gigsContainer.appendChild(gigCard);
                });
            }
        }

        // Function to filter and search gigs
        function filterAndSearchGigs() {
            const query = searchInput.value.toLowerCase().trim();
            const activeFilter = document.querySelector('.filter-btn.bg-green-500').dataset.filter;

            let filteredGigs = gigsData;

            // Filter by category
            if (activeFilter !== 'All') {
                filteredGigs = filteredGigs.filter(gig => gig.category === activeFilter);
            }

            // Filter by search query
            if (query) {
                filteredGigs = filteredGigs.filter(gig => 
                    gig.title.toLowerCase().includes(query) || 
                    gig.description.toLowerCase().includes(query)
                );
            }
            
            renderGigs(filteredGigs);
        }

        // Add event listeners
        searchInput.addEventListener('input', filterAndSearchGigs);

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Remove active class from all buttons
                filterBtns.forEach(b => {
                    b.classList.remove('bg-green-500', 'text-white');
                    b.classList.add('bg-gray-200', 'text-gray-600');
                });
                
                // Add active class to the clicked button
                btn.classList.add('bg-green-500', 'text-white');
                btn.classList.remove('bg-gray-200', 'text-gray-600');

                filterAndSearchGigs();
            });
        });

        // Initial render
        window.onload = () => {
            filterAndSearchGigs();
        };

    </script>
</body>
</html>
