<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Auth Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .bg-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .input-field {
            @apply w-full p-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="auth-container" class="bg-card rounded-xl p-8 max-w-sm w-full transition-all duration-300">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Welcome</h1>
        
        <div id="message-area" class="text-center p-3 rounded-md mb-4 hidden"></div>

        <div id="auth-form">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" class="input-field" placeholder="you@example.com">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••">
            </div>
            <div class="flex flex-col space-y-3">
                <button id="signup-btn" class="w-full bg-blue-600 text-white font-semibold py-3 px-4 rounded-md hover:bg-blue-700 transition-colors">Sign Up</button>
                <button id="login-btn" class="w-full bg-blue-500 text-white font-semibold py-3 px-4 rounded-md hover:bg-blue-600 transition-colors">Log In</button>
            </div>
        </div>

        <div id="user-info" class="text-center hidden">
            <p class="text-lg text-gray-800 mb-4">You are signed in as:</p>
            <p id="user-email" class="text-xl font-semibold mb-6 text-blue-600 truncate"></p>
            <button id="logout-btn" class="w-full bg-red-500 text-white font-semibold py-3 px-4 rounded-md hover:bg-red-600 transition-colors">Log Out</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: These global variables are provided by the canvas environment.
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // --- Firebase Initialization and Auth State Management ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('debug'); // Enable Firestore debug logs for troubleshooting

        // Elements
        const authForm = document.getElementById('auth-form');
        const userInfo = document.getElementById('user-info');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageArea = document.getElementById('message-area');
        const userEmailDisplay = document.getElementById('user-email');

        // Initial sign-in with custom token if available
        async function authenticateUser() {
            try {
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                    console.log("Signed in with custom token.");
                } else {
                    await signInAnonymously(auth);
                    console.log("Signed in anonymously.");
                }
            } catch (error) {
                console.error("Authentication error:", error);
            }
        }
        authenticateUser();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, update UI
                authForm.classList.add('hidden');
                userInfo.classList.remove('hidden');
                userEmailDisplay.textContent = user.email || 'Anonymous User';
                showMessage('You are successfully signed in!', 'bg-green-100 text-green-700');
            } else {
                // User is signed out, update UI
                authForm.classList.remove('hidden');
                userInfo.classList.add('hidden');
                userEmailDisplay.textContent = '';
                // Optional: clear message area on sign out
                // hideMessage();
            }
        });

        // --- Message Display Functions ---
        function showMessage(text, typeClasses) {
            messageArea.textContent = text;
            messageArea.className = `text-center p-3 rounded-md mb-4 ${typeClasses}`;
            messageArea.classList.remove('hidden');
        }

        function hideMessage() {
            messageArea.classList.add('hidden');
        }

        // --- Authentication Functions ---
        async function handleSignUp() {
            const email = emailInput.value;
            const password = passwordInput.value;
            hideMessage();

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log("User signed up successfully:", user.uid);
                // Note: onAuthStateChanged listener will handle UI update
            } catch (error) {
                console.error("Sign up error:", error.code, error.message);
                if (error.code === 'auth/email-already-in-use') {
                    showMessage('The email address is already in use. Please log in instead.', 'bg-red-100 text-red-700');
                } else if (error.code === 'auth/invalid-email') {
                    showMessage('The email address is not valid.', 'bg-red-100 text-red-700');
                } else if (error.code === 'auth/weak-password') {
                    showMessage('Password is too weak. Please use a stronger password.', 'bg-red-100 text-red-700');
                } else {
                    showMessage(`Sign up failed: ${error.message}`, 'bg-red-100 text-red-700');
                }
            }
        }

        async function handleLogin() {
            const email = emailInput.value;
            const password = passwordInput.value;
            hideMessage();

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log("User logged in successfully:", user.uid);
                // Note: onAuthStateChanged listener will handle UI update
            } catch (error) {
                console.error("Login error:", error.code, error.message);
                if (error.code === 'auth/invalid-credential') {
                    showMessage('Invalid credentials. Please check your email and password.', 'bg-red-100 text-red-700');
                } else {
                    showMessage(`Login failed: ${error.message}`, 'bg-red-100 text-red-700');
                }
            }
        }

        async function handleSignOut() {
            hideMessage();
            try {
                await signOut(auth);
                console.log("User signed out.");
                showMessage('You have been signed out.', 'bg-gray-100 text-gray-700');
            } catch (error) {
                console.error("Sign out error:", error);
                showMessage(`Sign out failed: ${error.message}`, 'bg-red-100 text-red-700');
            }
        }

        // --- Event Listeners ---
        document.getElementById('signup-btn').addEventListener('click', handleSignUp);
        document.getElementById('login-btn').addEventListener('click', handleLogin);
        document.getElementById('logout-btn').addEventListener('click', handleSignOut);

    </script>
</body>
</html>
