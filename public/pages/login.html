<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2F+9W8BqT0w+6p+uM6s8UqWp6q8q+tq/x+y+6F+P0+v+E+7z+g" crossorigin="anonymous">
    <!-- Custom CSS for Fiverr-like styling -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand text-fiverr-green fw-bold fs-4" href="/">Fiverr</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/pages/gigs.html">Gigs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/pages/messages.html">Messages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/pages/freelancers.html">Freelancers</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="/pages/login.html" class="btn btn-outline-secondary me-2">Sign In</a>
            <a href="/pages/register.html" class="btn btn-fiverr">Join</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card p-4 shadow login-container card-fiverr">
            <h2 class="card-title text-center mb-4 fw-bold">Log in to your account</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label text-sm font-medium text-gray-700">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label text-sm font-medium text-gray-700">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-fiverr w-100">Login</button>
            </form>
            <div id="message" class="mt-3 alert d-none" role="alert"></div>
            <div class="mt-3 text-center">
                <a href="/pages/register.html" class="text-fiverr-green">Don't have an account? Register here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted footer-brand">Fiverr Clone</span>
            <p class="mb-0 mt-2">© 2024 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-geWF76RCwLtnZ8qwWow/a7z7K/8W/f/8T9sF2Z5x95R9eN9r6E8E8/b" crossorigin="anonymous"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    messageDiv.classList.remove('d-none', 'alert-danger');
                    messageDiv.classList.add('alert-success');
                    messageDiv.textContent = 'Login successful! Redirecting...';
                    window.location.href = '/pages/gigs.html';
                } else {
                    messageDiv.classList.remove('d-none', 'alert-success');
                    messageDiv.classList.add('alert-danger');
                    messageDiv.textContent = data.msg || 'Login failed. Please check your credentials.';
                }
            } catch (err) {
                console.error('Error:', err);
                messageDiv.classList.remove('d-none', 'alert-success');
                messageDiv.classList.add('alert-danger');
                messageDiv.textContent = 'An error occurred. Please try again later.';
            }
        });
    </script>
</body>
</html>
