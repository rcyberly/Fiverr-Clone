<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Gigs | Fiverr Clone</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .my-gigs-container {
            max-width: 900px;
            margin: 50px auto;
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand text-fiverr-green fw-bold fs-4" href="/">Fiverr</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/gigs.html">Gigs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/freelancers.html">Freelancers</a>
            </li>
          </ul>
          <div class="d-flex" id="auth-links">
            <a href="/login.html" class="btn btn-outline-secondary me-2">Sign In</a>
            <a href="/register.html" class="btn btn-fiverr">Join</a>
          </div>
          <div class="d-flex" id="account-links" style="display: none;">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/messages.html">Messages</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/my-gigs.html">My Gigs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/create-gig.html">Post a Gig</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                      Account
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                      <li><a class="dropdown-item" href="/profile.html">Profile</a></li>
                      <li><hr class="dropdown-divider"></li>
                      <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                    </ul>
                </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-gigs-container">
        <h2 class="text-center mb-4">My Gigs</h2>
        <div id="my-gigs-container" class="row">
            <!-- Gigs will be dynamically inserted here -->
        </div>
        <div id="message" class="mt-3 alert d-none" role="alert"></div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <span class="text-muted footer-brand">Fiverr Clone</span>
            <p class="mb-0 mt-2">© 2024 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const authLinks = document.getElementById('auth-links');
            const accountLinks = document.getElementById('account-links');
            const logoutBtn = document.getElementById('logoutBtn');
            const myGigsContainer = document.getElementById('my-gigs-container');
            const messageDiv = document.getElementById('message');

            if (token) {
                authLinks.style.display = 'none';
                accountLinks.style.display = 'flex';
            } else {
                authLinks.style.display = 'flex';
                accountLinks.style.display = 'none';
                messageDiv.classList.remove('d-none');
                messageDiv.classList.add('alert-danger');
                messageDiv.textContent = 'You must be logged in to view your gigs.';
                return;
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    window.location.href = '/';
                });
            }

            try {
                const response = await fetch('/api/gigs/my-gigs', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const gigs = await response.json();

                if (!response.ok) {
                    throw new Error(gigs.msg || 'Failed to fetch gigs');
                }

                if (gigs.length === 0) {
                    myGigsContainer.innerHTML = '<p class="text-center">You have not posted any gigs yet.</p>';
                    return;
                }

                myGigsContainer.innerHTML = ''; // Clear loading message
                gigs.forEach(gig => {
                    const gigCard = `
                        <div class="col-md-6 mb-4">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title text-fiverr-green">${gig.title}</h5>
                                    <p class="card-text">${gig.description}</p>
                                    <p class="card-text fw-bold">$${gig.price}</p>
                                    <p class="card-text"><small class="text-muted">Skills: ${gig.skills.join(', ')}</small></p>
                                </div>
                            </div>
                        </div>
                    `;
                    myGigsContainer.innerHTML += gigCard;
                });
            } catch (err) {
                console.error('Failed to fetch my gigs:', err);
                messageDiv.classList.remove('d-none');
                messageDiv.classList.add('alert-danger');
                messageDiv.textContent = 'Failed to load your gigs. Please try again later.';
            }
        });
    </script>
</body>
</html>
