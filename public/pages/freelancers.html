<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freelancers | Fiverr Clone</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .text-fiverr-green {
            color: #1DBF73;
        }
        .btn-fiverr {
            background-color: #1DBF73;
            border-color: #1DBF73;
            color: white;
        }
        .btn-fiverr:hover {
            background-color: #1a9c67;
            border-color: #1a9c67;
        }
    </style>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand text-fiverr-green fw-bold fs-4" href="/">Fiverr</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/gigs">Gigs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/freelancers">Freelancers</a>
            </li>
          </ul>
          <div class="d-flex" id="auth-links">
            <a href="/login" class="btn btn-outline-secondary me-2">Sign In</a>
            <a href="/register" class="btn btn-fiverr">Join</a>
          </div>
          <div class="d-flex" id="account-links" style="display: none;">
            <ul class="navbar-nav mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/messages">Messages</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/my-gigs">My Gigs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/create-gigs">Post a Gig</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                      Account
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                      <li><a class="dropdown-item" href="/profile">Profile</a></li>
                      <li><hr class="dropdown-divider"></li>
                      <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                    </ul>
                </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <h1 class="fw-bold text-center mb-4">All Freelancers</h1>
        <div id="freelancers-container" class="row">
            <!-- Freelancers will be dynamically inserted here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-auto py-3">
        <div class="container text-center">
            <span class="text-muted footer-brand">Fiverr Clone</span>
            <p class="mb-0 mt-2">© 2024 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const authLinks = document.getElementById('auth-links');
            const accountLinks = document.getElementById('account-links');
            const logoutBtn = document.getElementById('logoutBtn');
            const freelancersContainer = document.getElementById('freelancers-container');

            if (token) {
                authLinks.style.display = 'none';
                accountLinks.style.display = 'flex';
            } else {
                authLinks.style.display = 'flex';
                accountLinks.style.display = 'none';
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    window.location.href = '/';
                });
            }

            try {
                const response = await fetch('/api/freelancers');
                const freelancers = await response.json();

                if (freelancers.length === 0) {
                    freelancersContainer.innerHTML = '<p class="text-center">No freelancers found.</p>';
                    return;
                }

                freelancers.forEach(freelancer => {
                    const freelancerCard = `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body text-center">
                                    <h5 class="card-title text-fiverr-green">${freelancer.username}</h5>
                                    <p class="card-text">${freelancer.email}</p>
                                    <a href="#" class="btn btn-fiverr">View Profile</a>
                                </div>
                            </div>
                        </div>
                    `;
                    freelancersContainer.innerHTML += freelancerCard;
                });
            } catch (err) {
                console.error('Failed to fetch freelancers:', err);
                freelancersContainer.innerHTML = '<p class="text-center text-danger">Failed to load freelancers. Please try again later.</p>';
            }
        });
    </script>
</body>
</html>
