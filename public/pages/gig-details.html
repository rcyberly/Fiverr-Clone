<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gig Details</title>
    <!-- Bootstrap CSS from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-9ndCyUaIbzAi2F+9W8BqT0w+6p+uM6s8UqWp6q8q+tq/x+y+6F+P0+v+E+7z+g" crossorigin="anonymous">
    <!-- Custom CSS for Fiverr-like styling -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Header -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand text-fiverr-green fw-bold fs-4" href="#">Fiverr</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="gigs.html">Gigs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="messages.html">Messages</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="my-gigs.html">My Gigs</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="create-gig.html">Post a Gig</a>
            </li>
          </ul>
          <div class="d-flex">
            <a href="#" class="btn btn-outline-secondary me-2">Sign In</a>
            <a href="#" class="btn btn-fiverr">Join</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <div class="container my-5">
        <div id="gig-details-container" class="card card-fiverr">
            <div class="card-body">
                <!-- Gig details will be dynamically inserted here by gig-details.js -->
                <div class="d-flex justify-content-center my-5">
                    <div class="spinner-border text-fiverr-green" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
        <div id="controls" class="mt-4 text-center">
            <button id="update-btn" class="btn btn-fiverr me-2" style="display:none;">Update Gig</button>
            <button id="delete-btn" class="btn btn-outline-danger" style="display:none;">Delete Gig</button>
        </div>
        <div id="message" class="mt-4 text-center"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted footer-brand">Fiverr Clone</span>
            <p class="mb-0 mt-2">© 2024 All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-geWF76RCwLtnZ8qwWow/a7z7K/8W/f/8T9sF2Z5x95R9eN9r6E8E8/b" crossorigin="anonymous"></script>
    <script src="../js/gig-details.js"></script>
</body>
</html>
