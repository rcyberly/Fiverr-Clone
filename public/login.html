<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fiverr Clone</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }
        .login-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .login-title {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #333;
        }
        .form-control:focus {
            border-color: #1DBF73;
            box-shadow: 0 0 0 0.25rem rgba(29, 191, 115, 0.25);
        }
        .btn-success {
            background-color: #1DBF73;
            border-color: #1DBF73;
            width: 100%;
            transition: background-color 0.3s ease;
        }
        .btn-success:hover {
            background-color: #14a867;
            border-color: #14a867;
        }
        .alert-error {
            color: #721c24;
            background-color: #f8d7da;
            border-color: #f5c6cb;
            padding: 0.75rem 1.25rem;
            border-radius: 0.25rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        footer {
            padding: 2rem;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <span style="color: #1DBF73; font-weight: bold;">fiverr</span><span style="font-weight: 300;">-clone</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Explore</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/messages.html">Messages</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/my-gigs.html">My Gigs</a>
                        </li>
                    </ul>
                    <div class="d-flex">
                        <a href="/login.html" class="btn btn-outline-success me-2">Sign In</a>
                        <a href="/register.html" class="btn btn-success">Join</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2 class="login-title">Log in to your account</h2>
            
            <div id="alertMessage" class="alert-error" style="display: none;"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-success">Continue</button>
            </form>
        </div>
    </main>

    <footer class="text-center text-lg-start">
        <div class="container p-4">
            <div class="row">
                <div class="col-lg-6 col-md-12 mb-4 mb-md-0">
                    <h5 class="text-uppercase">Fiverr Clone</h5>
                    <p>
                        A platform connecting freelancers and clients for a wide range of digital services.
                    </p>
                </div>
                <div class="col-lg-3 col-md-6 mb-4 mb-md-0">
                    <h5 class="text-uppercase">Links</h5>
                    <ul class="list-unstyled mb-0">
                        <li>
                            <a href="#!" class="text-dark">About Us</a>
                        </li>
                        <li>
                            <a href="#!" class="text-dark">Careers</a>
                        </li>
                    </ul>
                </div>
                <div class="col-lg-3 col-md-6 mb-4 mb-md-0">
                    <h5 class="text-uppercase">Connect</h5>
                    <ul class="list-unstyled mb-0">
                        <li>
                            <a href="#!" class="text-dark"><i class="fab fa-facebook-f"></i> Facebook</a>
                        </li>
                        <li>
                            <a href="#!" class="text-dark"><i class="fab fa-twitter"></i> Twitter</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.2);">
            © 2024 Fiverr-Clone. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertMessage = document.getElementById('alertMessage');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store the token securely
                    // Using localStorage for simplicity in this demo.
                    localStorage.setItem('token', data.token);
                    // Redirect to the main gigs page or dashboard
                    window.location.href = '/gigs.html';
                } else {
                    alertMessage.textContent = data.msg || 'Login failed. Please check your credentials.';
                    alertMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                alertMessage.textContent = 'An error occurred. Please try again later.';
                alertMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
